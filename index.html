<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f1a" />
  <title>Soirée — Jeux à boire & jeux d'ambiance</title>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <!-- iOS n'accepte que du PNG pour l'écran d'accueil : servi par le serveur (icone.js). -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Soirée" />
</head>
<body>
  <header class="app-header">
    <a href="#/" class="app-logo" aria-label="Accueil">
      <span class="app-logo__mark">🍻</span>
      <span class="app-logo__text">Soirée</span>
    </a>
  </header>

  <main id="app" class="app-main">
    <!-- Le routeur injecte ici -->
  </main>

  <footer class="app-footer">
    <p>À consommer avec modération · Réservé aux adultes · Fait pour rigoler entre potes</p>
  </footer>

  <!-- Région d'annonces pour lecteurs d'écran (persistante, hors flux visuel). -->
  <div id="a11y-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Avant les modules : affiche un message si le démarrage échoue (voir le fichier). -->
  <script src="src/boot.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
