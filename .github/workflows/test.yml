# Tests automatiques à chaque push (GitHub Actions).
# On teste DEUX versions : la plus ancienne acceptée (engines : >= 22) et celle
# de la prod (.node-version : 24). `node --test tests/` ne marchait que sur
# Node 20 — sur Node >= 22 le dossier est pris pour un module et tout casse.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
